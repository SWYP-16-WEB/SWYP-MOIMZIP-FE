name: PR Triage

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Assign author, request reviewers, and label
        uses: actions/github-script@v7
        with:
          script: |
            // 팀원 GitHub 아이디 → 사람 라벨 이름(이모지 제외)
            // 리뷰어 요청과 작성자 라벨링에 사용합니다. 팀원이 바뀌면 여기만 수정하세요.
            const TEAM = {
              "seunghye-rain": "승혜",
              "sunjung23": "선정",
            };

            // PR 제목 접두사 → 라벨 이름(이모지 제외). docs/conventions/commit.md의 접두사를 따릅니다.
            const PREFIX_LABELS = {
              init: "Init",
              feat: "Feature",
              fix: "Fix",
              docs: "Docs",
              style: "Style",
              refactor: "Refactor",
              chore: "Chore",
              deploy: "Deploy",
            };

            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const author = pr.user.login;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const issue = { ...repo, issue_number: pr.number };

            // 라벨 이름의 이모지·공백을 무시하고 텍스트로 실제 라벨을 찾습니다. (예: "✨Feature" ↔ "Feature")
            const normalize = (name) => name.replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
            const repoLabels = await github.paginate(github.rest.issues.listLabelsForRepo, repo);
            const findLabel = (keyword) =>
              repoLabels.find((label) => normalize(label.name) === normalize(keyword))?.name;

            if (action === "opened" || action === "reopened") {
              // 1. 작성자를 assignee로 지정
              await github.rest.issues.addAssignees({ ...issue, assignees: [author] });

              // 2. 작성자를 제외한 팀원에게 리뷰 요청
              const reviewers = Object.keys(TEAM).filter((login) => login !== author);
              if (reviewers.length > 0) {
                try {
                  await github.rest.pulls.requestReviewers({ ...repo, pull_number: pr.number, reviewers });
                } catch (error) {
                  core.warning(`리뷰어 요청 실패: ${error.message}`);
                }
              }

              // 3. 작성자 라벨 추가
              const authorLabel = TEAM[author] && findLabel(TEAM[author]);
              if (authorLabel) {
                await github.rest.issues.addLabels({ ...issue, labels: [authorLabel] });
              }
            }

            // 4. 제목 접두사 라벨 (edited는 본문만 수정해도 트리거되므로 제목 변경 시에만 다시 계산)
            if (action === "edited" && !context.payload.changes?.title) return;

            const prefixLabelNames = Object.values(PREFIX_LABELS).map(findLabel).filter(Boolean);
            const prefix = pr.title.match(/^\[(\w+)\]/)?.[1]?.toLowerCase();
            const nextLabel = prefix && PREFIX_LABELS[prefix] ? findLabel(PREFIX_LABELS[prefix]) : undefined;

            if (prefix && PREFIX_LABELS[prefix] && !nextLabel) {
              core.warning(`"${PREFIX_LABELS[prefix]}" 라벨이 저장소에 없어 접두사 라벨을 붙이지 않았습니다.`);
            }

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue(issue);
            for (const label of currentLabels) {
              if (prefixLabelNames.includes(label.name) && label.name !== nextLabel) {
                await github.rest.issues.removeLabel({ ...issue, name: label.name });
              }
            }

            if (nextLabel && !currentLabels.some((label) => label.name === nextLabel)) {
              await github.rest.issues.addLabels({ ...issue, labels: [nextLabel] });
            }
