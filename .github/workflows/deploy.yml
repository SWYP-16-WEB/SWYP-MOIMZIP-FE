name: Deploy

# main에 push(= develop → main 머지)되면 개인 fork 저장소의 main을 동일하게 맞춥니다.
# fork 저장소에 연결된 배포 서비스가 이 변경을 받아 배포합니다.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sync-fork-main
  cancel-in-progress: true

jobs:
  sync:
    name: Sync forked repo
    # fork 저장소에서는 이 워크플로우가 다시 실행되지 않도록 원본 저장소에서만 실행합니다.
    if: github.repository == 'SWYP-16-WEB/SWYP-MOIMZIP-FE'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_ACTIONS }}
          fetch-depth: 0
          ref: main

      - name: Push main to forked repo
        env:
          TOKEN: ${{ secrets.AUTO_ACTIONS }}
        run: git push -f "https://x-access-token:${TOKEN}@github.com/seunghye-rain/SWYP-MOIMZIP-FE.git" main
